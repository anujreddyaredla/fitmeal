spring.application.name=fitmeal-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mealmate_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
groq.vision.model=${GROQ_VISION_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}

jwt.secret=${JWT_SECRET:}
